  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"text-align:center\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.32em;text-transform:uppercase;color:#9B8A66\">Sur invitation<\u002Fdiv>\n        <div style=\"font-family:'Parisienne',cursive;font-size:44px;line-height:1.1;color:#1E3050;margin-top:8px\">Beaucens<\u002Fdiv>\n        <div style=\"font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8A8478;margin-top:8px\">10 juillet 2027<\u002Fdiv>\n        <p style=\"font-family:'Lato',sans-serif;font-size:13px;line-height:1.6;color:#5A5348;margin:22px auto 0;max-width:290px\">Entrez le mot de passe figurant sur votre invitation pour accéder au guide.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px\">\n        <input value=\"{{ pwInput }}\" sc-camel-on-change=\"{{ onPw }}\" sc-camel-on-key-down=\"{{ onPwKey }}\" type=\"password\" placeholder=\"Mot de passe\" style=\"width:100%;min-height:52px;border:1px solid #DFD2BE;border-radius:11px;padding:0 16px;font-size:14.5px;color:#33322E;background:#FFFDFA;text-align:center;letter-spacing:0.14em\">\n        <sc-if value=\"{{ pwError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Lato',sans-serif;font-size:12px;color:#C0432C;text-align:center;margin-top:9px\">Mot de passe incorrect.<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ unlock }}\" style=\"width:100%;min-height:52px;margin-top:12px;background:#1E3050;color:#fff;border:none;border-radius:11px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer\">Entrer<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"text-align:center;margin-top:26px\">\n        <button sc-camel-on-click=\"{{ goAdminGate }}\" style=\"background:none;border:none;font-family:'Lato',sans-serif;font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:#B0A794;cursor:pointer\">Espace organisateur<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;background:#F6EFE4;position:relative;padding:30px 24px 40px;display:flex;flex-direction:column\">\n      <svg sc-camel-view-box=\"0 0 120 220\" style=\"position:absolute;top:0;left:-14px;width:110px;opacity:0.42;pointer-events:none\" fill=\"none\" stroke=\"#A8B79B\" stroke-width=\"1.1\" stroke-linecap=\"round\">\n        <path d=\"M52 220C52 150 40 90 18 34\"><\u002Fpath>\n        <path d=\"M46 186c-14 2-24-4-30-16 12-4 24 2 30 16zM50 156c12-4 20-14 20-28-12 2-20 12-20 28zM40 128c-14 0-24-8-28-20 12-2 24 6 28 20zM34 98c12-6 18-16 16-30-10 4-18 16-16 30z\"><\u002Fpath>\n      <\u002Fsvg>\n      <svg sc-camel-view-box=\"0 0 120 220\" style=\"position:absolute;bottom:0;right:-16px;width:120px;opacity:0.38;pointer-events:none;transform:scaleX(-1)\" fill=\"none\" stroke=\"#C99A87\" stroke-width=\"1.1\" stroke-linecap=\"round\">\n        <path d=\"M56 0C56 70 44 140 20 200\"><\u002Fpath>\n        <path d=\"M50 40c-14 2-24-4-30-16 12-4 24 2 30 16zM48 78c12-4 20-14 20-28-12 2-20 12-20 28zM40 116c-14 0-24-8-28-20 12-2 24 6 28 20zM32 152c12-6 18-16 16-30-10 4-18 16-16 30z\"><\u002Fpath>\n      <\u002Fsvg>\n      <div style=\"position:relative;text-align:center;padding-top:6px\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.34em;text-transform:uppercase;color:#9B8A66\">Nous nous marions<\u002Fdiv>\n        <div style=\"font-family:'Parisienne',cursive;font-size:62px;line-height:1;color:#1E3050;margin-top:12px\">Notre<br>mariage<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;justify-content:center;margin-top:16px\">\n          <div style=\"width:34px;height:1px;background:#CDBBA0\"><\u002Fdiv>\n          <div style=\"font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#7C7669\">Samedi 10 juillet 2027<\u002Fdiv>\n          <div style=\"width:34px;height:1px;background:#CDBBA0\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <image-slot id=\"landing-photo\" style=\"width:100%;height:300px;display:block;margin-top:24px;border-radius:180px 180px 14px 14px\" shape=\"rounded\" radius=\"14\" placeholder=\"Photo du couple\" src=\"94568b20-0f51-4815-a291-fc67b9893951\"><\u002Fimage-slot>\n      <div style=\"position:relative;text-align:center;margin-top:22px\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;line-height:1.25;color:#1E3050\">Domaine de Beaucens<br>Hautes-Pyrénées<\u002Fdiv>\n        <p style=\"font-family:'Lato',sans-serif;font-size:13px;line-height:1.65;color:#5A5348;margin:12px auto 0;max-width:320px\">Confirmez votre présence, puis retrouvez tout le pratique : accès, hébergements, tenue et brunch du dimanche.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;margin-top:24px;display:grid;gap:10px\">\n        <button sc-camel-on-click=\"{{ goForm }}\" style=\"width:100%;min-height:54px;background:#C75C42;color:#fff;border:none;border-radius:12px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#B04E36\">Register<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goGuide }}\" style=\"width:100%;min-height:54px;background:transparent;color:#1E3050;border:1px solid #D8CAB4;border-radius:12px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#F1E9DC\">Voir le guide<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasSaved }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:relative;font-family:'Lato',sans-serif;font-size:11.5px;color:#8A8478;text-align:center;margin-top:14px\">Réponse déjà envoyée pour {{ savedName }} — vous pouvez la modifier.<\u002Fdiv>\n amel-on-click=\"{{ goGuide }}\" style=\"width:100%;min-height:52px;background:#1E3050;color:#fff;border:none;border-radius:12px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer\">Voir le guide<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goForm }}\" style=\"width:100%;min-height:50px;background:transparent;color:#1E3050;border:1px solid #D8CAB4;border-radius:12px;font-family:'Lato',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer\">Modifier ma réponse<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAdminGate }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;background:#1E3050;display:flex;flex-direction:column;justify-content:center;padding:34px 26px\">\n      <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:#E7B9A6;text-align:center\">Espace organisateur<\u002Fdiv>\n      <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:#fff;text-align:center;margin-top:10px\">Accès réservé<\u002Fdiv>\n      <input value=\"{{ adminInput }}\" sc-camel-on-change=\"{{ onAdminPw }}\" sc-camel-on-key-down=\"{{ onAdminKey }}\" type=\"password\" placeholder=\"Code organisateur\" style=\"width:100%;min-height:52px;margin-top:22px;border:1px solid rgba(255,255,255,0.26);border-radius:11px;padding:0 16px;font-size:14.5px;color:#fff;background:rgba(255,255,255,0.09);text-align:center;letter-spacing:0.14em\">\n      <sc-if value=\"{{ adminError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:12px;color:#E7B9A6;text-align:center;margin-top:9px\">Code incorrect.<\u002Fdiv>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ adminUnlock }}\" style=\"width:100%;min-height:52px;margin-top:12px;background:#C75C42;color:#fff;border:none;border-radius:11px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer\">Entrer<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goBackFromAdmin }}\" style=\"background:none;border:none;margin-top:20px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8697B4;cursor:pointer\">← Retour<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;padding:20px 20px 40px;background:#FBF9F5\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n        <div>\n          <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;color:#6D8A6E\">Espace organisateur<\u002Fdiv>\n          <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;color:#1E3050;margin:5px 0 0\">Réponses reçues<\u002Fh2>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ adminLogout }}\" style=\"flex:none;background:none;border:1px solid #E3DACB;border-radius:9px;min-height:40px;padding:0 12px;font-family:'Lato',sans-serif;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8478;cursor:pointer\">Quitter<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px\">\n        <div style=\"border:1px solid #E9E2D5;border-radius:11px;padding:13px 14px;background:#FFFDFA\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;color:#1E3050;line-height:1\">{{ statPeople }}<\u002Fdiv>\n          <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8A8478;margin-top:5px\">Personnes au mariage<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9E2D5;border-radius:11px;padding:13px 14px;background:#FFFDFA\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;color:#1E3050;line-height:1\">{{ statReplies }}<\u002Fdiv>\n          <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8A8478;margin-top:5px\">Réponses<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E7DDC6;border-radius:11px;padding:13px 14px;background:#FBF8F0\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;color:#1E3050;line-height:1\">{{ statBrunch }}<\u002Fdiv>\n          <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#BE9445;margin-top:5px\">Au brunch<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E8D5CE;border-radius:11px;padding:13px 14px;background:#FDF8F4\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;color:#C75C42;line-height:1\">{{ statMoney }}<\u002Fdiv>\n          <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#C75C42;margin-top:5px\">Brunch à encaisser<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:6px;background:#F1ECE3;border-radius:11px;padding:5px;margin-top:16px\">\n        <button sc-camel-on-click=\"{{ filterAll }}\" style=\"{{ fAllStyle }}\">Tous<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ filterAmis }}\" style=\"{{ fAmisStyle }}\">Amis<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ filterFamille }}\" style=\"{{ fFamilleStyle }}\">Famille<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;gap:9px;margin-top:14px\">\n        <sc-for list=\"{{ entries }}\" as=\"e\" hint-placeholder-count=\"2\">\n          <div style=\"border:1px solid #E9E2D5;border-radius:12px;padding:14px 15px;background:#FFFDFA\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#1E3050\">{{ e.name }}<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#7C7669;border:1px solid #E3DACB;border-radius:20px;padding:3px 9px\">{{ e.cat }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:11.5px;color:#8A8478;margin-top:4px\">{{ e.contact }} · {{ e.date }}<\u002Fdiv>\n            <sc-if value=\"{{ e.hasAddress }}\"><div style=\"font-family:'Lato',sans-serif;font-size:11.5px;line-height:1.45;color:#6B675F;margin-top:4px\">{{ e.address }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#33322E;margin-top:8px\">{{ e.party }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:9px\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:11px;color:#1E3050;background:#F1ECE3;border-radius:7px;padding:5px 9px\">{{ e.countLabel }}<\u002Fdiv>\n              <div style=\"font-family:'Lato',sans-serif;font-size:11px;color:#1E3050;background:#FBF8F0;border-radius:7px;padding:5px 9px\">{{ e.brunchLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ e.hasNotes }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:12px;line-height:1.55;color:#5A5348;background:#F7F4EE;border-radius:9px;padding:10px 12px;margin-top:10px\">{{ e.notes }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ e.remove }}\" style=\"background:none;border:none;padding:0;margin-top:10px;font-family:'Lato',sans-serif;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#C0432C;cursor:pointer\">Supprimer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ adminEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;color:#8A8478;padding:20px 2px\">Aucune réponse pour l’instant.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"width:100%;min-height:50px;margin-top:18px;background:#1E3050;color:#fff;border:none;border-radius:11px;font-family:'Lato',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer\">Exporter en CSV<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isGuide }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-bottom:104px\">\n      <div style=\"position:relative;background:#1E3050;padding:20px 22px 30px;overflow:hidden\">\n        <button sc-camel-on-click=\"{{ goLanding }}\" style=\"background:none;border:none;padding:0;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8697B4;cursor:pointer\">← Accueil<\u002Fbutton>\n        <div style=\"font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:#E7B9A6;margin-top:18px\">Notre mariage<\u002Fdiv>\n        <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:0.95;letter-spacing:0.04em;color:#FFFFFF;margin:10px 0 0\">GUIDE<\u002Fh1>\n        <div style=\"font-family:'Parisienne',cursive;font-size:34px;line-height:1;color:#E7B9A6;margin:-2px 0 0 3px\">pratique<\u002Fdiv>\n        <img id=\"couple-photo-web\" src=\"./couple-photo.jpg\" alt=\"Photo du couple\" style=\"width:100%;height:200px;display:block;margin-top:20px;border-radius:10px;object-fit:cover;object-position:center 42%\">\n        <div style=\"display:flex;gap:10px;margin-top:18px\">\n          <div style=\"flex:1;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:11px 8px;text-align:center\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;line-height:1;color:#FFFFFF\">{{ cdDays }}<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#A8B6CC;margin-top:5px\">Jours<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:11px 8px;text-align:center\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;line-height:1;color:#FFFFFF\">{{ cdHours }}<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#A8B6CC;margin-top:5px\">Heures<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:11px 8px;text-align:center\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;line-height:1;color:#FFFFFF\">{{ cdMins }}<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#A8B6CC;margin-top:5px\">Minutes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"essentiel\" class=\"sc\" style=\"padding:22px 22px 0\">\n        <div style=\"background:#1E3050;border-radius:14px;padding:20px;color:#fff\">\n          <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.24em;text-transform:uppercase;color:#E7B9A6\">Le jour du mariage — c’est ici qu’on vous attend<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;margin-top:14px\">\n            <div style=\"flex:none;text-align:center;padding-right:16px;border-right:1px solid rgba(255,255,255,0.22)\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:#E7B9A6\">Samedi<\u002Fdiv>\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1;color:#FFFFFF;margin:2px 0\">10<\u002Fdiv>\n              <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#E7B9A6\">Juil. 2027<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;line-height:1.1;color:#FFFFFF\">Célébration au Domaine de Beaucens<\u002Fdiv>\n              <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.5;color:#D5DCE8;margin-top:7px\">À partir de 15h — 17 route d’Argelès, 65400 Beaucens<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"https://www.google.com/maps/place/Domaine+de+Beaucens/@42.9787047,-0.0686227,17z/data=!4m17!1m7!3m6!1s0xd57d9783a1bfe49:0x5a66813967544c77!2s17+Rte+d'Argel%C3%A8s,+65400+Beaucens!3b1!8m2!3d42.9787047!4d-0.0660478!3m8!1s0xd57d9e66317524f:0xf506c297a80d8d75!5m2!4m1!1i2!8m2!3d42.978294!4d-0.065666!16s%2Fg%2F11xkqssb05?entry=ttu&g_ep=EgoyMDI2MDgxNi4wIKXMDSoASAFQAw%3D%3D\" target=\"_blank\" style=\"display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;margin-top:16px;background:#C75C42;color:#fff;border-radius:9px;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 21s-7-6.3-7-11a7 7 0 1114 0c0 4.7-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n            Itinéraire\n          <\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:9px;background:#FDF4EF;border-radius:11px;padding:13px 15px;margin-top:12px\">\n          <div style=\"flex:none;width:19px;height:19px;border-radius:50%;background:#C75C42;color:#fff;font-family:'Lato',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px\">!<\u002Fdiv>\n          <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#5A4237\">Beaucens est dans les Hautes-Pyrénées, à <strong>2 h de Biarritz<\u002Fstrong>. Une voiture est indispensable, et vous réservez vous-même votre hébergement pour la nuit du 10.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"programme\" class=\"sc\" style=\"padding:30px 22px 0\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;color:#6D8A6E\">Programme<\u002Fdiv>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;color:#1E3050;margin:5px 0 14px\">Trois jours, un seul incontournable<\u002Fh2>\n        <div style=\"display:grid;gap:10px\">\n          <div style=\"border:1px solid #E8D5CE;border-radius:12px;padding:15px 16px;background:#FDF8F4\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:#C75C42\">Vendredi 9 juillet<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#A78376;border:1px solid #E2C7BC;border-radius:20px;padding:3px 9px\">Optionnel<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20px;color:#1E3050;margin-top:6px\">Mariage civil à Biarritz<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#4A4A46;margin-top:6px\">15h, Mairie de Biarritz — 12 Av. Edouard VII, 64200 Biarritz. Pour ceux qui peuvent/veulent ; ce n’est pas la célébration principale.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:2px solid #1E3050;border-radius:12px;padding:15px 16px;background:#F7FAF6\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:#6D8A6E\">Samedi 10 juillet<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#fff;background:#1E3050;border-radius:20px;padding:4px 10px\">Le mariage<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20px;color:#1E3050;margin-top:6px\">Célébration au Domaine de Beaucens<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#4A4A46;margin-top:6px\">À partir de 15h. Nous conseillons d’arriver à 15h. Cérémonie et apéritif en extérieur, dîner en salle climatisée.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E7DDC6;border-radius:12px;padding:15px 16px;background:#FBF8F0\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:#BE9445\">Dimanche 11 juillet<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:#A78D5B;border:1px solid #E3D3AC;border-radius:20px;padding:3px 9px\">Optionnel<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:20px;color:#1E3050;margin-top:6px\">Brunch à Beaucens<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#4A4A46;margin-top:6px\">30 € par personne, sur réservation — dites-nous si vous souhaitez être présent.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"transports\" class=\"sc\" style=\"padding:30px 22px 0\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;color:#6D8A6E\">Transports<\u002Fdiv>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;color:#1E3050;margin:5px 0 10px\">Venir jusqu’au domaine<\u002Fh2>\n        <p style=\"font-family:'Lato',sans-serif;font-size:13px;line-height:1.6;color:#33322E;margin:0 0 14px\">Le Domaine de Beaucens se trouve au pied des Pyrénées, il n’est pas accessible en transport en commun, une voiture est nécessaire pour y accéder. Voici les aéroports et gares les plus proches :<\u002Fp>\n        <div style=\"display:flex;gap:6px;background:#F1ECE3;border-radius:11px;padding:5px;margin-bottom:14px\">\n          <button sc-camel-on-click=\"{{ showAir }}\" style=\"{{ airTabStyle }}\">Aéroports<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showRail }}\" style=\"{{ railTabStyle }}\">Gares<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:8px\">\n          <sc-for list=\"{{ routes }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;background:#FAF6EF;border-radius:11px;padding:13px 15px\">\n              <div>\n                <div style=\"font-family:'Lato',sans-serif;font-weight:700;font-size:13px;color:#1E3050\">{{ r.name }}<\u002Fdiv>\n                <div style=\"font-family:'Lato',sans-serif;font-size:11.5px;line-height:1.45;color:#7C7669;margin-top:3px\">{{ r.note }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:none;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;color:#C75C42;text-align:right;line-height:1.15\">{{ r.time }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:'Lato',sans-serif;font-size:11.5px;line-height:1.55;color:#7C7669;margin-top:11px\">Temps indiqués en voiture depuis le domaine. Pas de navette prévue ; parking gratuit non couvert sur place.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"hebergements\" class=\"sc\" style=\"padding:30px 22px 0\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;color:#6D8A6E\">Hébergements<\u002Fdiv>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;color:#1E3050;margin:5px 0 10px\">Où dormir la nuit du 10<\u002Fh2>\n        <div style=\"margin:0 0 16px;border:1px solid #E7D7BC;border-radius:14px;background:#FFF8EC;overflow:hidden\">\n          <div style=\"padding:13px 15px;background:#F5E8D2;display:flex;align-items:center;gap:9px\">\n            <div style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#BE9445;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Lato',sans-serif;font-size:14px;font-weight:700\">!<\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#8A6B2D;font-weight:700\">Information hébergement<\u002Fdiv>\n              <div style=\"font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.15;color:#1E3050;font-weight:600;margin-top:2px\">Disponibilités au Domaine de Beaucens<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 15px 15px\">\n            <div style=\"display:grid;gap:8px\">\n              <div style=\"display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:10px;background:#EEF5EC;border:1px solid #D5E3D1\">\n                <div style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#6D8A6E;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Lato',sans-serif;font-size:13px;font-weight:700\">✓<\u002Fdiv>\n                <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.4;color:#334733\"><strong>Familles des futurs mariés :<\u002Fstrong> les chambres au domaine sont garanties.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:10px;background:#FFF8EC;border:1px solid #E7D7BC\">\n                <div style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#BE9445;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Lato',sans-serif;font-size:13px;font-weight:700\">?<\u002Fdiv>\n                <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.4;color:#5A4725\"><strong>Amis :<\u002Fstrong> nous ne pouvons pas encore confirmer si des chambres resteront disponibles au domaine.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;padding-top:11px;border-top:1px solid #EADDC8\">\n              <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#6D8A6E;font-weight:700\">Notre conseil pour les amis<\u002Fdiv>\n              <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#33322E;margin-top:4px\">Pour sécuriser votre hébergement, nous vous recommandons de réserver dès maintenant dans les environs, notamment parmi les options ci-dessous.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:10px\">\n          <div style=\"border:1px solid #DCE3D9;border-radius:12px;padding:14px 16px;background:#F7FAF6\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#1E3050\">Argelès-Gazost<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:10.5px;color:#6D8A6E;font-weight:700\">10/15 min<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#6D8A6E;margin-top:5px\">Notre recommandation<\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#4A4A46;margin-top:6px\">Hôtels indépendants, Logis, chambres d’hôtes, appartements et maisons de vacances, idéalement près du centre.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E9E2D5;border-radius:12px;padding:14px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#1E3050\">Lourdes<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:10.5px;color:#9A9284;font-weight:700\">25 min<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#4A4A46;margin-top:8px\">La plus grande offre hôtelière de la région, des hôtels simples aux établissements avec services complets ; le secteur de la gare est pratique.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #E9E2D5;border-radius:12px;padding:14px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n              <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:#1E3050\">Beaucens, Saint-Savin, Pierrefitte-Nestalas<\u002Fdiv>\n              <div style=\"flex:none;font-family:'Lato',sans-serif;font-size:10.5px;color:#9A9284;font-weight:700\">0/10 min<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.55;color:#4A4A46;margin-top:8px\">Chambres d’hôtes, gîtes et locations locales en nombre plus limité.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"faq\" class=\"sc\" style=\"padding:30px 22px 0\">\n        <div style=\"font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.26em;text-transform:uppercase;color:#6D8A6E\">Questions fréquentes<\u002Fdiv>\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;color:#1E3050;margin:5px 0 12px\">Tout ce qu’on nous demande<\u002Fh2>\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Rechercher une question…\" style=\"width:100%;min-height:46px;border:1px solid #E3DACB;border-radius:10px;padding:0 14px;font-size:13.5px;color:#33322E;background:#FFFDFA\">\n        <div style=\"display:grid;gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <div style=\"border:1px solid #EDE5D8;border-radius:11px;overflow:hidden;background:#FFFDFA\">\n              <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:transparent;border:none;cursor:pointer;text-align:left\">\n                <span style=\"font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;color:#1E3050;line-height:1.25\">{{ f.q }}<\u002Fspan>\n                <span style=\"flex:none;font-family:'Lato',sans-serif;font-size:17px;color:#C75C42;width:20px;text-align:center\">{{ f.sign }}<\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:0 15px 14px;font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.6;color:#4A4A46\">{{ f.a }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;color:#8A8478;padding:14px 2px\">Aucune question ne correspond. Écrivez-nous, on répond vite.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"padding:32px 22px 26px;margin-top:30px;background:#1E3050;text-align:center\">\n        <div style=\"font-family:'Parisienne',cursive;font-size:30px;color:#E7B9A6\">À très vite !<\u002Fdiv>\n        <div style=\"font-family:'Lato',sans-serif;font-size:12.5px;line-height:1.6;color:#D5DCE8;margin-top:10px\">Envoyez-nous vos allergies et régimes alimentaires, vos besoins de covoiturage et vos questions.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goAdminGate }}\" style=\"background:none;border:none;margin-top:18px;font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#8697B4;cursor:pointer\">Espace organisateur<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 0 14px\">\n        <div style=\"pointer-events:auto;display:flex;gap:2px;background:rgba(255,253,250,0.94);backdrop-filter:blur(12px);border:1px solid #E8DFD0;border-radius:16px;padding:6px;box-shadow:0 10px 30px rgba(30,48,80,0.14)\">\n          <a href=\"#essentiel\" style=\"min-width:62px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:11px;font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:#1E3050\" style-hover=\"background:#F4EFE8\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" f r\" stroke-width=\"1.8\"><path d=\"M4 11l8-6 8 6M6 10v10h12V10\"><\u002Fpath><path d=\"M10 20v-5h4v5\"><\u002Fpath><\u002Fsvg>\n            Dormir\n          <\u002Fa>\n          <a href=\"#faq\" style=\"min-width:62px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:11px;font-family:'Lato',sans-serif;font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;color:#1E3050\" style-hover=\"background:#F4EFE8\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M9.7 9.6a2.4 2.4 0 114.1 1.7c-.9.8-1.8 1.2-1.8 2.3\"><\u002Fpath><circle cx=\"12\" cy=\"17\" r=\"0.9\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n            FAQ\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900}}\">\nconst GUEST_PW = \"beaucens2027\";\nconst ADMIN_PW = \"orga2027\";\nconst STORE = \"beaucens_rsvps\";\n// Collez ici l’URL /exec de votre déploiement Google Apps Script.\nconst API_URL = \"https://script.google.com/macros/s/AKfycbzq0pfai53nG1DXVzcE2m6XBKOhE14W7Up9-3wjzo9GCWV-YCkLejQQ0BbQhHgQSHkj/exec\";\nconst IBAN = \"FR76 3000 3038 3300 0538 1309 424\";\n\nconst FAQ = [\n  [\"Le logement est-il compris ?\", \"Non. Il vous faut réserver votre propre logement en dehors du domaine le soir du 10 juillet 2027.\"],\n  [\"Combien coût le brunch ?\", \"Le brunch est à 30€ par personne et nécessite une réservation, merci de nous indiquer si vous souhaitez être présent.\"],\n  [\"Où conseillez-vous de dormir ?\", \"Argelès-Gazost est le meilleur compromis. Lourdes offre le plus grand choix d’hôtels.\"],\n  [\"Quand réserver ?\", \"Dès que possible : juillet est une haute e,\n    adminInput: \"\", adminError: false, adminFilter: \"all\",\n    form: { prenom:\"\", nom:\"\", contact:\"\", adresse:\"\", codePostal:\"\", ville:\"\", pays:\"\", cat:\"friend\", brunch:false, brunchCount:1, notes:\"\" },\n    guests: [],\n    formError: false, submitError: \"\", submitting: false, ibanCopied: false,\n    rsvps: [], lastName: \"\",\n    open: {}, query: \"\", mode: \"air\", now: Date.now()\n  };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 30000);\n    let rsvps = [];\n    try { rsvps = JSON.parse(localStorage.getItem(STORE) || \"[]\"); } catch (e) { rsvps = []; }\n    this.persist(Array.isArray(rsvps) ? rsvps : []);\n    this.loadRsvps();\n  }\n\n  apiReady() { return API_URL && API_URL.indexOf(\"PASTE_YOUR_\") !== 0; }\n  async loadRsvps() {\n    if (!this.apiReady()) return;\n    try {\n      const response = await fetch(API_URL + \"?action=list&t=\" + Date.now());\n      if (!response.ok) throw new Error(\"HTTP \" + response.status);\n      const data = await response.json();\n      if (!data.ok || !Array.isArray(data.rsvps)) throw new Error(data.error || \"Réponse invalide\");\n      this.persist(data.rsvps);\n    } catch (e) { console.warn(\"Chargement Google Sheets impossible\", e); }\n  }\n  async callApi(payload) {\n    if (!this.apiReady()) return { ok: true, localOnly: true };\n    const response = await fetch(API_URL, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n      body: JSON.stringify(payload)\n    });\n    if (!response.ok) throw new Error(\"HTTP \" + response.status);\n    const data = await response.json();\n    if (!data.ok) throw new Error(data.error || \"Erreur Google Sheets\");\n    return data;\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  normalizeCat(cat) {\n    const key = String(cat || \"\").trim().toLowerCase();\n    return key === \"family\" || key === \"famille\" ? \"family\" : \"friend\";\n  }\n  persist(rsvps) {\n    const normalized = (Array.isArray(rsvps) ? rsvps : []).map(r => Object.assign({}, r, { cat: this.normalizeCat(r.cat) }));\n    this.setState({ rsvps: normalized });\n    try { localStorage.setItem(STORE, JSON.stringify(normalized)); } catch (e) {}\n  }\n  setF(k, v) { this.setState(s => ({ form: Object.assign({}, s.form, { [k]: v }) })); }\n  pill(active, on) {\n    return \"flex:1;min-height:46px;border:1px solid \" + (active ? on : \"#E3DACB\") + \";border-radius:10px;cursor:pointer;font-family:'Lato',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\" +\n      (active ? \"background:\" + on + \";color:#fff\" : \"background:#FFFDFA;color:#8A8478\");\n  }\n  tab(active) {\n    return \"flex:1;min-height:40px;border:none;border-radius:8px;cursor:pointer;font-family:'Lato',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;\" +\n      (active ? \"background:#1E3050;color:#fff\" : \"background:transparent;color:#8A8478\");\n  }\n  headcount() { return 1 + this.state.guests.filter(g => (g.type || \"Adulte\") !== \"Bébé\").length; }\n\n  submit = async () => {\n    const f = this.state.form;\n    if (!f.prenom.trim() || !f.nom.trim() || !f.contact.trim()) { this.setState({ formError: true }); return; }\n    if (this.state.submitting) return;\n    this.setState({ submitting: true, submitError: \"\" });\n    const entry = {\n      id: Date.now(),\n      prenom: f.prenom.trim(), nom: f.nom.trim(), contact: f.contact.trim(), adresse: f.adresse.trim(), codePostal: f.codePostal.trim(), ville: f.ville.trim(), pays: f.pays.trim(),\n      cat: f.cat, brunch: f.brunch, brunchCount: f.brunch ? f.brunchCount : 0,\n      notes: f.notes.trim(),\n      guests: this.state.guests.filter(g => g.name.trim()).map(g => ({ name: g.name.trim(), type: g.type || \"Adulte\" })),\n      date: new Date().toLocaleDateString(\"fr-FR\")\n    };\n    entry.total = 1 + entry.guests.length;\n    const rest = this.state.rsvps.filter(r => (r.prenom + r.nom).toLowerCase() !== (entry.prenom + entry.nom).toLowerCase());\n    try {\n      await this.callApi({ action: \"upsert\", entry: entry });\n      this.persist(rest.concat([entry]));\n      this.setState({ formError: false, submitting: false, view: \"done\", lastName: entry.prenom + \" \" + entry.nom });\n    } catch (e) {\n      this.setState({ submitting: false, submitError: \"La réponse n’a pas pu être enregistrée. Vérifiez votre connexion puis réessayez.\" });\n      console.error(e);\n    }\n  };\n\n  exportCsv = () => {\n    const rows = [[\"Prénom\",\"Nom\",\"Contact\",\"Adresse\",\"Code postal\",\"Ville\",\"Pays\",\"Catégorie\",\"Personnes\",\"Accompagnants\",\"Brunch\",\"Personnes brunch\",\"Montant brunch\",\"Notes\",\"Date\"]];\n    this.state.rsvps.forEach(r => rows.push([\n      r.prenom, r.nom, r.contact, r.adresse || \"\", r.codePostal || \"\", r.ville || \"\", r.pays || \"\", r.cat, r.total,\n      (r.guests || []).map(g => g.name + \" (\" + g.type + \")\").join(\" / \"),\n      r.brunch ? \"Oui\" : \"Non\", r.brunchCount, (r.brunchCount * 30) + \" €\",\n      (r.notes || \"\").replace(/\\n/g, \" \"), r.date\n    ]));\n    const csv = rows.map(r => r.map(c => '\"' + String(c).replace(/\"/g, '\"\"') + '\"').join(\";\")).join(\"\\n\");\n    const url = URL.createObjectURL(new Blob([\"\\ufeff\" + csv], { type: \"text/csv;charset=utf-8\" }));\n    const a = document.createElement(\"a\");\n    a.href = url; a.download = \"reponses-mariage-beaucens.csv\";\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n  };\n\n  renderVals() {\n    const s = this.state, f = s.form, v = s.view;\n    const target = new Date(\"2027-07-10T15:00:00+02:00\").getTime();\n    const diff = Math.max(0, target - s.now);\n    const q = s.query.trim().toLowerCase();\n    const faqList = FAQ.filter(([qq, aa]) => !q || (qq + \" \" + aa).toLowerCase().includes(q));\n    const filtered = s.adminFilter === \"all\" ? s.rsvps : s.rsvps.filter(r => r.cat === s.adminFilter);\n    const brunchPeople = s.rsvps.reduce((n, r) => n + (r.brunchCount || 0), 0);\n\n    return {\n      isLocked: v === \"lock\", isLanding: v === \"landing\", isForm: v === \"form\",\n      isDone: v === \"done\", isGuide: v === \"guide\", isAdminGate: v === \"adminGate\", isAdmin: v === \"admin\",\n\n      pwInput: s.pwInput, pwError: s.pwError,\n      onPw: e => this.setState({ pwInput: e.target.value, pwError: false }),\n      onPwKey: e => { if (e.key === \"Enter\") this.tryUnlock(); },\n      unlock: () => this.tryUnlock(),\n\n      goLanding: () => this.setState({ view: \"landing\" }),\n      goForm: () => this.setState({ view: \"form\", formError: false }),\n      goGuide: () => this.setState({ view: \"guide\" }),\n      goAdminGate: () => this.setState({ view: \"adminGate\", adminInput: \"\", adminError: false }),\n      goBackFromAdmin: () => this.setState({ view: \"lock\" }),\n\n      hasSaved: !!s.lastName, savedName: s.lastName,\n\n      f: f,\n      setPrenom: e => this.setF(\"prenom\", e.target.value),\n      setNom: e => this.setF(\"nom\", e.target.value),\n      setContact: e => this.setF(\"contact\", e.target.value),\n      setAdresse: e => this.setF(\"adresse\", e.target.value),\n      setCodePostal: e => this.setF(\"codePostal\", e.target.value),\n      setVille: e => this.setF(\"ville\", e.target.value),\n      setPays: e => this.setF(\"pays\", e.target.value),\n      setNotes: e => this.setF(\"notes\", e.target.value),\n      setAmi: () => this.setF(\"cat\", \"friend\"),\n      setFamille: () => this.setF(\"cat\", \"family\"),\n      amiStyle: this.pill(f.cat === \"friend\", \"#C75C42\"),\n      familleStyle: this.pill(f.cat === \"family\", \"#6D8A6E\"),\n\n      guests: s.guests.map((g, i) => ({\n        name: g.name, type: g.type,\n        onName: e => { const v2 = e.target.value; this.setState(st => { const a = st.guests.slice(); a[i] = Object.assign({}, a[i], { name: v2 }); return { guests: a }; }); },\n        onType: e => { const v2 = e.target.value; this.setState(st => { const a = st.guests.slice(); a[i] = Object.assign({}, a[i], { type: v2 }); return { guests: a }; }); },\n        remove: () => this.setState(st => ({ guests: st.guests.filter((x, j) => j !== i) }))\n      })),\n      addGuest: () => this.setState(st => ({ guests: st.guests.concat([{ name: \"\", type: \"Adulte\" }]) })),\n      totalLabel: (1 + s.guests.length) + \" personne\" + (s.guests.length ? \"s\" : \"\") + \" au total\",\n\n      brunchYes: () => this.setF(\"brunch\", true),\n      brunchNo: () => this.setF(\"brunch\", false),\n      brunchYesStyle: this.pill(f.brunch === true, \"#BE9445\"),\n      brunchNoStyle: this.pill(f.brunch === false, \"#8A8478\"),\n      brunchCount: String(f.brunchCount),\n      brunchTotal: (f.brunchCount * 30) + \" €\",\n      brunchLess: () => this.setF(\"brunchCount\", Math.max(1, f.brunchCount - 1)),\n      brunchMore: () => this.setF(\"brunchCount\", Math.min(20, f.brunchCount + 1)),\n      ibanLabel: s.ibanCopied ? \"IBAN copié ✓\" : \"Copier l’IBAN\",\n      copyIban: () => {\n        try { navigator.clipboard.writeText(IBAN); } catch (e) {}\n        this.setState({ ibanCopied: true });\n        setTimeout(() => this.setState({ ibanCopied: false }), 2500);\n      },\n\n      formError: s.formError, submitError: s.submitError, submitting: s.submitting,\n      submitLabel: s.submitting ? \"Enregistrement…\" : \"Envoyer ma réponse\",\n      submit: this.submit,\n      doneSummary: \"Votre réponse est enregistrée pour \" + (1 + s.guests.length) + \" personne\" + (s.guests.length ? \"s\" : \"\") +\n        (f.brunch ? \", brunch inclus pour \" + f.brunchCount + \" (\" + (f.brunchCount * 30) + \" € à régler)\" : \", sans le brunch\") + \".\",\n\n      adminInput: s.adminInput, adminError: s.adminError,\n      onAdminPw: e => this.setState({ adminInput: e.target.value, adminError: false }),\n      onAdminKey: e => { if (e.key === \"Enter\") this.tryAdmin(); },\n      adminUnlock: () => this.tryAdmin(),\n      adminLogout: () => this.setState({ view: \"landing\" }),\n      statReplies: String(s.rsvps.length),\n      statPeople: String(s.rsvps.reduce((n, r) => n + (r.total || 1), 0)),\n      statBrunch: String(brunchPeople),\n      statMoney: (brunchPeople * 30) + \" €\",\n      filterAll: () => this.setState({ adminFilter: \"all\" }),\n      filterAmis: () => this.setState({ adminFilter: \"friend\" }),\n      filterFamille: () => this.setState({ adminFilter: \"family\" }),\n      fAllStyle: this.tab(s.adminFilter === \"all\"),\n      fAmisStyle: this.tab(s.adminFilter === \"friend\"),\n      fFamilleStyle: this.tab(s.adminFilter === \"family\"),\n      adminEmpty: filtered.length === 0,\n      entries: filtered.slice().reverse().map(r => ({\n        name: r.prenom + \" \" + r.nom, cat: r.cat === \"family\" ? \"Famille\" : \"Ami·e\", contact: r.contact, date: r.date, address: [r.adresse, r.codePostal, r.ville, r.pays].filter(Boolean).join(\", \"), hasAddress: !!(r.adresse || r.codePostal || r.ville || r.pays),\n        party: (r.guests || []).length ? \"Avec \" + r.guests.map(g => g.name + \" (\" + g.type + \")\").join(\", \") : \"Vient seul·e\",\n        countLabel: (r.total || 1) + \" pers.\",\n        brunchLabel: r.brunch ? \"Brunch \" + r.brunchCount + \" · \" + (r.brunchCount * 30) + \" €\" : \"Pas de brunch\",\n        hasNotes: !!(r.notes && r.notes.length), notes: r.notes,\n        remove: async () => { try { await this.callApi({ action: \"delete\", id: r.id }); this.persist(this.state.rsvps.filter(x => x.id !== r.id)); } catch (e) { alert(\"Suppression impossible. Réessayez.\"); } }\n      })),\n      exportCsv: this.exportCsv,\n\n      cdDays: String(Math.floor(diff / 86400000)),\n      cdHours: String(Math.floor(diff / 3600000) % 24),\n      cdMins: String(Math.floor(diff / 60000) % 60),\n      routes: s.mode === \"air\" ? AIR : RAIL,\n      airTabStyle: this.tab(s.mode === \"air\"),\n      railTabStyle: this.tab(s.mode === \"rail\"),\n      showAir: () => this.setState({ mode: \"air\" }),\n      showRail: () => this.setState({ mode: \"rail\" }),\n      query: s.query,\n      onQuery: e => this.setState({ query: e.target.value }),\n      noResults: faqList.length === 0,\n      faqs: faqList.map(([qq, aa]) => ({\n        q: qq, a: aa, open: !!s.open[qq], sign: s.open[qq] ? \"–\" : \"+\",\n        toggle: () => this.setState(st => ({ open: Object.assign({}, st.open, { [qq]: !st.open[qq] }) }))\n      }))\n    };\n  }\n\n  tryUnlock() {\n    if (this.state.pwInput.trim().toLowerCase() === GUEST_PW) this.setState({ view: \"landing\", pwInput: \"\", pwError: false });\n    else this.setState({ pwError: true });\n  }\n  tryAdmin() {\n    if (this.state.adminInput.trim().toLowerCase() === ADMIN_PW) this.setState({ view: \"admin\", adminInput: \"\", adminError: false });\n    else this.setState({ adminError: true });\n  }\n}\n<\u002Fscript>\n\n\n<a href=\"./en.html\" aria-label=\"View this site in English\" style=\"position:fixed;top:12px;right:12px;z-index:99998;display:flex;align-items:center;justify-content:center;min-width:46px;height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:#1E3050;color:#fff;font:700 12px/1 Lato,sans-serif;letter-spacing:.12em;text-decoration:none;box-shadow:0 4px 16px rgba(30,48,80,.22)\">EN<\u002Fa><\u002Fbody><\u002Fhtml>"
